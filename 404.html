<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#0a0a0a">

    <title>404 — Off Route | RoughRoadCycling</title>
    <meta name="description" content="Signal lost. You are off route. Return to base and find your way back to the gravel.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg);
            position: relative;
            overflow: hidden;
        }
        
        /* Static Noise Overlay */
        .static-noise {
            position: absolute;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            width: 200%;
            height: 200%;
            background: transparent url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Dissolve_Noise_Texture.png') repeat 0 0;
            background-repeat: repeat;
            animation: bg-animation .2s infinite;
            opacity: 0.15;
            visibility: visible;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bg-animation {
            0% { transform: translate(0,0) }
            10% { transform: translate(-5%,-5%) }
            20% { transform: translate(-10%,5%) }
            30% { transform: translate(5%,-10%) }
            40% { transform: translate(-5%,15%) }
            50% { transform: translate(-10%,5%) }
            60% { transform: translate(15%,0) }
            70% { transform: translate(0,10%) }
            80% { transform: translate(-15%,0) }
            90% { transform: translate(10%,5%) }
            100% { transform: translate(5%,0) }
        }

        .error-content {
            z-index: 1;
            text-align: center;
            padding: var(--space-lg);
            border: 4px solid #ff003c;
            background: rgba(5,5,5,0.8);
            backdrop-filter: blur(5px);
            animation: glitch-flash 3s infinite;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            color: #ff003c;
            line-height: 0.8;
            margin-bottom: var(--space-sm);
        }

        .error-message {
            font-size: clamp(1.5rem, 4vw, 3rem);
            color: #fff;
            text-transform: uppercase;
            font-family: var(--font-heading);
            letter-spacing: 2px;
            margin-bottom: var(--space-md);
        }

        .btn-error {
            background: #ff003c;
            color: #fff;
            border-color: #ff003c;
        }
        .btn-error:hover {
            background: #fff;
            color: #ff003c;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">RoughRoad<span>Cycling</span></a>
        </div>
    </header>

    <!-- Error Section -->
    <section class="error-page">
        <div class="static-noise"></div>
        <div class="error-content fade-in-up is-visible">
            <h1 class="brutalist-title error-code">404</h1>
            <p class="error-message">// SIGNAL LOST //<br>YOU ARE OFF ROUTE</p>
            <a href="index.html" class="btn btn-error">Return to Base</a>
            <div style="margin-top: var(--space-md); display: flex; gap: var(--space-sm); justify-content: center; flex-wrap: wrap;">
                <a href="reviews.html" style="color:#fff; text-decoration: underline; font-weight: 700;">Gear</a>
                <a href="guides.html" style="color:#fff; text-decoration: underline; font-weight: 700;">Guides</a>
                <a href="routes.html" style="color:#fff; text-decoration: underline; font-weight: 700;">Routes</a>
                <a href="blog/" style="color:#fff; text-decoration: underline; font-weight: 700;">Blog</a>
            </div>
        </div>
    </section>

    <!-- Marquee -->
    <div class="marquee-container" style="background: #ff003c; color: #fff; border-color: #ff003c;">
        <div class="marquee-content">
            <span>// RECALCULATING ROUTE // TURN AROUND // RECALCULATING ROUTE // TURN AROUND //</span>
            <span>// RECALCULATING ROUTE // TURN AROUND // RECALCULATING ROUTE // TURN AROUND //</span>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
